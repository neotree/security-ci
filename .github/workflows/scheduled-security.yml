name: Scheduled Security Scan (reusable)

# Re-scans the calling repository on a schedule. Advisory databases, CodeQL queries and
# campaign intelligence all change after a pull request merges, so a repository that was
# clean at merge time is not necessarily clean today.
on:
  workflow_call:
    inputs:
      security-ci-ref:
        description: Pinned neotree/security-ci commit SHA. Must match the caller's `uses:`.
        type: string
        required: true
      policy-overlay:
        type: string
        default: security/policy.json
      gitleaks-ignore:
        type: string
        default: security/gitleaks-ignore.txt
      enable-codeql:
        description: >-
          Off by default: CodeQL runs from the organisation-level code scanning
          configuration. See security-ci.yml.
        type: boolean
        default: false
      enable-all-branch-scan:
        type: boolean
        default: true
      upload-sarif:
        type: boolean
        default: true
      enable-osv:
        type: boolean
        default: true
      osv-cvss-threshold:
        description: >-
          Fail the scheduled run on OSV findings at or above this CVSS score. Same default
          and semantics as the pull-request pipeline; see security-ci.yml.
        type: string
        default: "9.0"

permissions:
  contents: read

jobs:
  repository-policy:
    name: Scheduled Malware/Policy Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - name: Repository malware and policy scan
        shell: bash
        env:
          OVERLAY: ${{ inputs.policy-overlay }}
        run: |
          set -Eeuo pipefail
          args=(--root repo --policy scanner/security/policy.defaults.json
                --iocs scanner/security/polinrider_iocs.json
                --report reports/scheduled-security-report.json
                --sarif reports/scheduled-security-report.sarif)
          if [ -f "repo/${OVERLAY}" ]; then args+=(--policy-overlay "repo/${OVERLAY}"); fi
          python3 scanner/security/scan_repo.py "${args[@]}"
      - name: Upload findings to code scanning
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: reports/scheduled-security-report.sarif
          category: repo-policy-scanner
      - name: Upload scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-policy-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  all-branches:
    name: All-Branch Malware Scan
    # A pull-request gate only ever sees the branch being merged. The reported "commit
    # twin" technique force-pushes infected commits across many branches at once, so a
    # payload can sit on a stale branch indefinitely, one `git checkout` from a developer.
    if: ${{ inputs.enable-all-branch-scan }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - name: Scan every remote branch
        env:
          TARGET_REPO: repo
          POLICY_OVERLAY: ${{ inputs.policy-overlay }}
        run: ./scanner/security/scan_all_branches.sh

  gitleaks:
    name: Scheduled Secret History Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - name: Gitleaks FULL Git history scan
        shell: bash
        env:
          GITLEAKS_IGNORE_PATH: repo/${{ inputs.gitleaks-ignore }}
        # No base SHA: this is the scan that walks everything, and the one that catches a
        # secret predating the pipeline. Pull requests get the cheap incremental scope.
        run: ./scanner/security/run_secret_scan.sh repo

  osv:
    name: Scheduled OSV Dependency Scan
    # The pull-request pipeline only checks dependencies when something is pushed. A new
    # advisory against a dependency that is already on the default branch would otherwise
    # stay invisible until the next unrelated pull request happened to trip over it.
    if: ${{ inputs.enable-osv }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.osv.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: .security-scanner
          persist-credentials: false
      - name: Scan dependency manifests and lockfiles
        id: osvscan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          # --config: the trusted, ignore-free config from security-ci. Without it OSV
          # reads any osv-scanner.toml a pull request adds, which can ignore packages.
          scan-args: |-
            --config=.security-scanner/security/osv-scanner.toml
            --format=json
            --output=osv-results.json
            --include-git-root
            -r
            ./
      - name: Fail closed if OSV itself did not complete
        if: ${{ steps.osvscan.outcome == 'failure' }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::OSV-Scanner failed without producing results."
            exit 1
          fi
      - name: Produce SARIF and annotations
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=false
      - name: Fail on vulnerabilities at or above the CVSS threshold
        env:
          THRESHOLD: ${{ inputs.osv-cvss-threshold }}
        run: |
          python3 .security-scanner/security/gate_sarif.py osv-results.sarif \
            --fail-on-cvss "${THRESHOLD}" --cvss-ceiling 9.0 --label OSV
      - name: Upload OSV report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-osv-report
          path: |
            osv-results.json
            osv-results.sarif
          retention-days: 30
          if-no-files-found: ignore

  codeql:
    name: Scheduled CodeQL (${{ matrix.language }})
    if: ${{ inputs.enable-codeql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
