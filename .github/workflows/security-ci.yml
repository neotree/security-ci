name: Security CI (reusable)

# Reusable unprivileged pipeline. The caller supplies the triggers
# (pull_request / merge_group / push); this workflow does the work.
#
# The scanner always comes from neotree/security-ci at the pinned SHA, never from the
# repository under test. Each repository supplies only its own policy overlay, which may
# tighten the gate but never loosen it.
on:
  workflow_call:
    inputs:
      security-ci-ref:
        description: Pinned neotree/security-ci commit SHA. Must match the caller's `uses:`.
        type: string
        required: true
      node-version:
        type: string
        default: "22"
      policy-overlay:
        description: Path, in the calling repository, to its policy overlay.
        type: string
        default: security/policy.json
      gitleaks-ignore:
        description: Path, in the calling repository, to its Gitleaks fingerprint file.
        type: string
        default: security/gitleaks-ignore.txt
      enable-codeql:
        description: >-
          Run this pipeline's own CodeQL jobs. Off by default: CodeQL is enabled for every
          Neotree repository by the organisation-level code scanning configuration, which
          rejects SARIF from a second, advanced configuration - so running it here as well
          fails the upload without adding coverage. Turn on only for a repository outside
          the organisation configuration.
        type: boolean
        default: false
      enable-dependency-review:
        type: boolean
        default: true
      osv-cvss-threshold:
        description: >-
          Block on OSV findings whose CVSS score is at or above this. OSV-Scanner marks
          every SARIF result "warning" regardless of severity, so its own --fail-on-vuln
          flag is all-or-nothing; the score lives in the rule's security-severity property
          and is gated by security/gate_sarif.py instead. Default 9.0 (critical) is a
          starting point to ratchet down, not a target. Newly INTRODUCED high-severity
          dependencies are blocked separately and unconditionally by Dependency Review.
        type: string
        default: "9.0"
      enable-quality:
        description: Install dependencies and run audit/lint/typecheck/test/build.
        type: boolean
        default: true
      upload-sarif:
        description: Disable for private repositories without code scanning.
        type: boolean
        default: true
      extra-egress-endpoints:
        description: >-
          Space-separated host:port entries the project's install/build needs. harden-runner
          splits on spaces only; write one per line with a folded scalar (`>-`), never `|`.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static-policy:
    name: Static Policy
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - name: Verify the caller pins workflow and scanner to the same commit
        # Dependabot updates `uses:` but not `security-ci-ref`, so a routine bump would
        # otherwise run a new workflow against an old scanner with nothing saying so.
        # --require-all: removing one of the three connectors (e.g. the malware gate)
        # is itself a failure, not a quieter pipeline.
        run: python3 scanner/security/check_caller_pin.py --require-all repo
      - name: Scanner regression tests
        working-directory: scanner
        run: python3 -m unittest discover -s security/tests -t . -v
      - name: Repository malware and policy scan
        shell: bash
        env:
          OVERLAY: ${{ inputs.policy-overlay }}
        run: |
          set -Eeuo pipefail
          args=(--root repo
                --policy scanner/security/policy.defaults.json
                --iocs scanner/security/polinrider_iocs.json
                --report reports/security-report.json
                --sarif reports/security-report.sarif)
          if [ -f "repo/${OVERLAY}" ]; then args+=(--policy-overlay "repo/${OVERLAY}"); fi
          python3 scanner/security/scan_repo.py "${args[@]}"
      - name: Upload findings to code scanning
        if: ${{ always() && inputs.upload-sarif && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: reports/security-report.sarif
          category: repo-policy-scanner
      - name: Upload scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-policy-report
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  quality:
    name: Dependencies + Quality + Tests + Build
    if: ${{ inputs.enable-quality && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: "true"
      NODE_ENV: test
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      YARN_ENABLE_SCRIPTS: "false"
      PNPM_ENABLE_PRE_POST_SCRIPTS: "false"
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Hosts a specific project's build needs (Prisma engines, Google Fonts for
          # next/font, ...) come from the caller's `extra-egress-endpoints`, so each one
          # is visible and reviewed in the repository that needs it.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            ${{ inputs.extra-egress-endpoints }}
      # A malformed entry is not rejected by harden-runner: a newline-joined list becomes
      # one host with port 0 and the rest are dropped, so the build later dies with an
      # ECONNREFUSED that looks like an outage. Fail here instead, naming the cause.
      - name: Validate extra-egress-endpoints
        shell: bash
        env:
          EXTRA: ${{ inputs.extra-egress-endpoints }}
        run: |
          set -Eeuo pipefail
          if [[ "${EXTRA}" == *$'\n'* ]]; then
            echo "::error::extra-egress-endpoints contains a newline. harden-runner splits on spaces only, so these hosts are NOT allowed. Use a folded scalar (>-) or one space-separated line."
            exit 1
          fi
          read -r -a entries <<< "${EXTRA}"
          for entry in "${entries[@]}"; do
            if [[ ! "${entry}" =~ ^[A-Za-z0-9*]([A-Za-z0-9.-]*[A-Za-z0-9])?:[0-9]{1,5}$ ]]; then
              echo "::error::extra-egress-endpoints entry '${entry}' is not host:port."
              exit 1
            fi
          done
      - name: Checkout repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Re-check policy before project execution
        shell: bash
        env:
          OVERLAY: ${{ inputs.policy-overlay }}
        run: |
          set -Eeuo pipefail
          args=(--root repo --policy scanner/security/policy.defaults.json
                --iocs scanner/security/polinrider_iocs.json)
          if [ -f "repo/${OVERLAY}" ]; then args+=(--policy-overlay "repo/${OVERLAY}"); fi
          python3 scanner/security/scan_repo.py "${args[@]}"
      - name: Install safely, audit, lint, typecheck, test and build
        env:
          SECURITY_POLICY_DEFAULTS: ${{ github.workspace }}/scanner/security/policy.defaults.json
          SECURITY_POLICY_OVERLAY: ${{ github.workspace }}/repo/${{ inputs.policy-overlay }}
        run: python3 scanner/security/run_project_checks.py --repo repo
      # The post-build scan does NOT run here. Every lint/test/build script and every
      # dependency above ran in this job with write access to the `scanner` checkout, so
      # anything they left behind - a rewritten scan_repo.py, a relaxed policy - would
      # judge its own output. The tree is handed to a fresh job on a clean runner instead.
      - name: Hand the post-build tree to an isolated scan job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-build-tree
          path: |
            repo/
            !repo/.git/
            !repo/**/node_modules/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  post-build-scan:
    name: Post-Build Injection Scan
    needs: [quality]
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
      - name: Download the post-build tree as inert data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: post-build-tree
          path: built
      - name: Checkout pinned scanner (fresh; never touched by project code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      # The overlay comes from a clean checkout of the commit under test, not from the
      # post-build tree: a build step must not be able to relax the policy that judges it.
      - name: Checkout policy overlay source (clean)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: |
            security
          sparse-checkout-cone-mode: true
      - name: Detect build-time/source injection after project scripts
        shell: bash
        env:
          OVERLAY: ${{ inputs.policy-overlay }}
        run: |
          set -Eeuo pipefail
          args=(--root built --policy scanner/security/policy.defaults.json
                --iocs scanner/security/polinrider_iocs.json
                --report reports/post-build-security-report.json)
          if [ -f "source/${OVERLAY}" ]; then args+=(--policy-overlay "source/${OVERLAY}"); fi
          python3 scanner/security/scan_repo.py "${args[@]}"
      - name: Upload post-build scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-build-report
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  gitleaks:
    name: Secret Scan
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout repository under test (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - name: Gitleaks secret scan (pinned binary + checksum)
        shell: bash
        env:
          # Trusted config from security-ci; acknowledged fingerprints from the repo itself,
          # because a leak and its remediation are inherently repository-specific.
          GITLEAKS_IGNORE_PATH: repo/${{ inputs.gitleaks-ignore }}
          # Scope the scan to what this change introduces. Full history runs on the
          # schedule; re-walking it on every pull request costs ~9 minutes here and finds
          # nothing new, because history does not change between pull requests. The script
          # falls back to a full scan whenever the range cannot be established.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scanner/security/run_secret_scan.sh repo "${BASE_SHA}"

  semgrep:
    name: Semgrep Local SAST
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:6f6f4c1ea22ae02736b023dd4dcc842a4f50b25bbe1898530ec3bfff388b369b
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # registry-1.docker.io only serves the manifest; it 307s the layer blobs to one
          # of Docker Hub's two CDNs and picks between them per request. Both must be
          # allowed - listing only one makes `docker pull` fail deterministically whenever
          # the redirect lands on the other, which is easy to misread as rate limiting
          # because the manifest fetch itself succeeds.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - name: Checkout repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: scanner
          persist-credentials: false
      - name: Pull digest-pinned Semgrep non-root image
        shell: bash
        run: |
          set -Eeuo pipefail
          # Anonymous Docker Hub pulls are rate limited per source IP (100/hour) and
          # GitHub-hosted runners share egress addresses, so a transient 429 must not fail
          # the gate. Rate limiting is transient and clears within these retries; a pull
          # that fails all five attempts identically is usually not rate limiting but a
          # blocked endpoint, so the failure message points at both.
          for attempt in 1 2 3 4 5; do
            if docker pull "${SEMGREP_IMAGE}"; then exit 0; fi
            echo "Semgrep image pull attempt ${attempt} failed; retrying in $((attempt * 20))s" >&2
            sleep "$((attempt * 20))"
          done
          echo "::error::Could not pull the pinned Semgrep image after 5 attempts. If every attempt failed the same way this is more likely a harden-runner egress block than Docker Hub rate limiting: check the run's network policy report for a denied host and add it to allowed-endpoints."
          exit 1
      - name: Semgrep local + vendored community rules, offline container
        shell: bash
        run: |
          set -Eeuo pipefail
          # The Semgrep image runs as a non-root uid that differs from the runner user,
          # so the bind-mounted output directory must be world-writable.
          mkdir -p reports && chmod 0777 reports
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            -e HOME=/tmp \
            -v "${PWD}/repo:/src:ro" \
            -v "${PWD}/scanner/security:/rules:ro" \
            -v "${PWD}/reports:/out:rw" \
            -w /src \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config /rules/semgrep-rules.yml \
              --config /rules/semgrep \
              --metrics off \
              --disable-nosem \
              --sarif \
              --output /out/semgrep.sarif
      # ERROR results block, and so do the reviewed WARNING rules listed in
      # semgrep-blocking-rules.txt (injection, hardcoded secrets, XXE, SSRF, TLS bypass).
      # --disable-nosem above means an inline `nosemgrep` comment in the repository under
      # test cannot silence any of them; accepted risk goes through the policy overlay.
      # Accepted risk for Semgrep lives in the same reviewed, dated policy files as the
      # custom scanner's (`"rule": "semgrep:<rule-id>"`), never in the shared rules.
      - name: Block on ERROR results and promoted high-confidence rules
        env:
          OVERLAY: ${{ inputs.policy-overlay }}
        run: |
          python3 scanner/security/gate_sarif.py reports/semgrep.sarif --fail-on error --label Semgrep \
            --block-rules scanner/security/semgrep-blocking-rules.txt \
            --policy scanner/security/policy.defaults.json \
            --policy-overlay "repo/${OVERLAY}"
      - name: Upload Semgrep results to code scanning
        if: ${{ always() && inputs.upload-sarif && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep
      - name: Upload Semgrep report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true && inputs.enable-dependency-review }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # The action looks up an OpenSSF Scorecard for every dependency the PR adds or
          # changes (api.securityscorecards.dev, with api.deps.dev to map a package to its
          # source repository). It only does this when dependencies change, so blocking
          # these hosts passes most PRs and fails dependency PRs with a bare "fetch failed".
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            api.deps.dev:443
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: false
      - name: Explain a network failure
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::If Dependency Review failed with 'fetch failed' rather than listing vulnerable packages, a host it needs was blocked by harden-runner. Check the 'domain not allowed' lines in this job's post-run log and add the host to allowed-endpoints."

  osv:
    name: OSV Dependency Vulnerability Scan
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.osv.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned scanner
        # security-ci contains no package manifests or lockfiles, so checking it out
        # beside the repository under test adds no OSV scan targets. Verified: OSV reports
        # "No package sources found" for this tree.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neotree/security-ci
          ref: ${{ inputs.security-ci-ref }}
          path: .security-scanner
          persist-credentials: false
      - name: Scan dependency manifests and lockfiles
        id: osvscan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          # --config: the trusted, ignore-free config from security-ci. Without it OSV
          # reads any osv-scanner.toml a pull request adds, which can ignore packages.
          scan-args: |-
            --config=.security-scanner/security/osv-scanner.toml
            --format=json
            --output=osv-results.json
            --include-git-root
            -r
            ./
      - name: Fail closed if OSV itself did not complete
        if: ${{ steps.osvscan.outcome == 'failure' }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::OSV-Scanner failed without producing results. Blocking merge."
            exit 1
          fi
      - name: Produce SARIF and annotations
        # --fail-on-vuln=false on purpose: it fails on ANY vulnerability at any severity,
        # which no repository with a real dependency tree can hold. The severity gate is
        # the next step.
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=false
      - name: Block on vulnerabilities at or above the CVSS threshold
        # Via env, never interpolated into the script: it is a caller-supplied string.
        env:
          THRESHOLD: ${{ inputs.osv-cvss-threshold }}
        run: |
          python3 .security-scanner/security/gate_sarif.py osv-results.sarif \
            --fail-on-cvss "${THRESHOLD}" --cvss-ceiling 9.0 --label OSV
      - name: Upload OSV report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: |
            osv-results.json
            osv-results.sarif
          retention-days: 14
          if-no-files-found: ignore

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ github.event.pull_request.draft != true && inputs.enable-codeql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  merge-gate:
    name: Merge Gate
    if: ${{ always() }}
    needs: [static-policy, quality, post-build-scan, gitleaks, semgrep, dependency-review, osv, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      STATIC_POLICY: ${{ needs.static-policy.result }}
      QUALITY: ${{ needs.quality.result }}
      POST_BUILD: ${{ needs.post-build-scan.result }}
      GITLEAKS: ${{ needs.gitleaks.result }}
      SEMGREP: ${{ needs.semgrep.result }}
      DEP_REVIEW: ${{ needs.dependency-review.result }}
      OSV: ${{ needs.osv.result }}
      CODEQL: ${{ needs.codeql.result }}
    steps:
      - name: Require every enabled security job to pass
        shell: bash
        run: |
          set -Eeuo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Deliberately no pipeline here. Wrapping this in `{ ... } | tee` puts the loop
          # in a subshell, so assignments to `status` are discarded and the gate exits 0
          # no matter which jobs failed. shellcheck SC2030/SC2031 catch exactly that.
          emit() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >> "${SUMMARY}"
          }

          status=0
          emit "## Merge Gate"
          emit ""
          emit "| Job | Result |"
          emit "| --- | --- |"
          for item in \
            "static-policy=${STATIC_POLICY}" \
            "quality=${QUALITY}" \
            "post-build-scan=${POST_BUILD}" \
            "gitleaks=${GITLEAKS}" \
            "semgrep=${SEMGREP}" \
            "dependency-review=${DEP_REVIEW}" \
            "osv=${OSV}" \
            "codeql=${CODEQL}"; do
            name="${item%%=*}"
            result="${item#*=}"
            emit "| ${name} | ${result} |"
            case "${result}" in
              success|skipped) ;;
              *) status=1 ;;
            esac
          done

          # "skipped" is a pass only when there was nothing to scan. Once the project
          # checks have run, the post-build scan must actually have run and passed.
          if [ "${QUALITY}" = "success" ] && [ "${POST_BUILD}" != "success" ]; then
            emit ""
            emit "Project checks ran but the post-build injection scan did not pass."
            status=1
          fi

          if [ "${status}" -ne 0 ]; then
            emit ""
            emit "One or more security jobs did not pass. Do not bypass this gate; see docs/INCIDENT_RESPONSE.md."
            echo "::error::One or more security jobs did not pass. Do not bypass this gate; see docs/INCIDENT_RESPONSE.md."
          fi
          exit "${status}"
